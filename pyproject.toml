[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dave"
version = "1.0.1"
description = "Dave scientific command-line calculator"
readme = "README.md"
authors = [{name = "rachburgess", email = "rachburgess@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "scipy",
    "sympy",
    "matplotlib",
    "rich",
    "pandas",
    "yfinance",
    "deep-translator",
    "mendeleev>=1.3.0; python_version < '3.15'",
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/rachburgess/Dave"
Repository = "https://github.com/rachburgess/Dave.git"
"Bug Tracker" = "https://github.com/rachburgess/Dave/issues"

[tool.setuptools.packages.find]
include = ["Dave*"]
