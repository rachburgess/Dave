[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dave"
version = "1.0.0"
description = "Dave - Cross-platform Python application for various operating systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [{name = "rachburgess", email = "rachburgess@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[project.urls]
Homepage = "https://github.com/rachburgess/Dave"
Repository = "https://github.com/rachburgess/Dave.git"
"Bug Tracker" = "https://github.com/rachburgess/Dave/issues"
